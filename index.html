<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>GHISA — Piano Allenamento</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Ghisa" />
<meta name="theme-color" content="#F7F6F3" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FFFFFF'/%3E%3Crect x='8' y='44' width='84' height='12' rx='6' fill='%231F6F64'/%3E%3Ccircle cx='24' cy='50' r='21' fill='none' stroke='%23211F1B' stroke-width='7'/%3E%3Ccircle cx='76' cy='50' r='21' fill='none' stroke='%23211F1B' stroke-width='7'/%3E%3C/svg%3E" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FFFFFF'/%3E%3Crect x='8' y='44' width='84' height='12' rx='6' fill='%231F6F64'/%3E%3Ccircle cx='24' cy='50' r='21' fill='none' stroke='%23211F1B' stroke-width='7'/%3E%3Ccircle cx='76' cy='50' r='21' fill='none' stroke='%23211F1B' stroke-width='7'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F7F6F3;
    --surface:#FFFFFF;
    --surface-2:#F0EEE9;
    --border:#E1DDD3;
    --text:#211F1B;
    --text-muted:#847E70;
    --accent:#1F6F64;
    --accent-soft:#E3F0ED;
    --danger:#B3412B;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:9px;
    --font-display:'Oswald',sans-serif;
    --font-body:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --shadow:0 1px 2px rgba(33,31,27,0.04), 0 6px 16px rgba(33,31,27,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }
  .topbar{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px;
    background:linear-gradient(var(--bg) 75%, transparent);
  }
  .topbar__brand{
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
    letter-spacing:0.14em;
    color:var(--text);
  }
  .topbar__brand span{color:var(--accent);}
  .topbar__meta{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .view{
    flex:1;
    padding:4px 20px 110px;
  }
  .section-title{
    font-family:var(--font-display);
    font-size:13px;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:22px 0 10px;
  }
  .section-title:first-child{margin-top:6px;}

  .guide{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:6px 16px 14px;
    margin-top:6px;
  }
  .guide__step{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:12px 0;
    border-top:1px solid var(--border);
  }
  .guide__step:first-child{border-top:none;}
  .guide__num{
    flex:none;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-family:var(--font-mono);
    font-weight:600;
    font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  .guide__text{font-size:13.5px;line-height:1.45;padding-top:3px;}
  .guide__text b{color:var(--text);}

  .day-picker{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .day-picker__btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow);
    padding:14px 12px;
    text-align:left;
    cursor:pointer;
  }
  .day-picker__btn small{
    display:block;
    font-family:var(--font-mono);
    font-weight:400;
    font-size:11px;
    color:var(--text-muted);
    margin-top:3px;
    text-transform:none;
    letter-spacing:0;
  }
  .day-picker__btn.is-active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }
  .day-picker__btn.is-active small{color:#3E8478;}
  .day-picker__btn--cardio{grid-column:1 / -1;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:14px;
  }

  input[type="date"]{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:13px;
    border-radius:var(--radius-sm);
    padding:9px 10px;
  }

  .exercise{
    padding:14px 0;
    border-top:1px solid var(--border);
  }
  .exercise:first-of-type{border-top:none;padding-top:4px;}
  .exercise__head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .exercise__name{
    font-weight:600;
    font-size:15px;
    line-height:1.3;
  }
  .exercise__target{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--accent);
    white-space:nowrap;
    padding-top:2px;
  }
  .exercise__note{
    font-size:12.5px;
    color:var(--text-muted);
    margin-top:3px;
    line-height:1.4;
  }
  .exercise__rest{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
    margin-top:6px;
  }

  .set-label{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-top:12px;
    margin-bottom:6px;
  }
  .set-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .set-line{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:8px 10px;
  }
  .set-line__label{
    flex:none;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-muted);
    white-space:nowrap;
  }
  .set-line.is-filled{border-color:var(--accent);background:var(--accent-soft);}
  .set-line.is-filled .set-line__label{color:var(--accent);}
  .set-line__group{
    display:flex;
    align-items:center;
    gap:6px;
    flex:1;
    min-width:112px;
  }
  .set-input{
    flex:1;
    min-width:0;
    height:40px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:15px;
    text-align:center;
  }
  .set-input:focus{outline:none;border-color:var(--accent);}
  .set-input::placeholder{color:#B7B0A0;}
  .set-line__unit{
    flex:none;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
  }

  .field-row{display:flex;gap:10px;}
  .field{flex:1;display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .field label{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;}
  .field input[type="number"], .field input[type="text"]{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:15px;
    border-radius:var(--radius-sm);
    padding:11px 12px;
  }
  .field input:focus{outline:none;border-color:var(--accent);}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    font-family:var(--font-body);
    font-weight:600;
    font-size:15px;
    padding:14px;
    border-radius:var(--radius-md);
    border:1px solid transparent;
    cursor:pointer;
  }
  .btn--primary{background:var(--accent);color:#fff;}
  .btn--primary:active{background:#175A51;}
  .btn--ghost{background:var(--surface);border-color:var(--border);color:var(--text);}
  .btn--danger{background:transparent;border-color:var(--danger);color:var(--danger);font-size:12.5px;padding:8px 12px;width:auto;}
  .btn--danger.is-confirm{background:var(--danger);color:#fff;}

  .banner{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--accent-soft);
    color:#175A51;
    border:1px solid #BFE0D8;
    border-radius:var(--radius-md);
    padding:12px 14px;
    font-size:13.5px;
    margin-bottom:14px;
  }

  .feedback{
    background:var(--accent-soft);
    border:1px solid #BFE0D8;
    border-radius:var(--radius-md);
    padding:14px;
    margin-bottom:14px;
  }
  .feedback__summary{font-weight:600;font-size:13.5px;color:#175A51;}
  .feedback__line{font-size:13px;color:#1F4F47;line-height:1.5;margin-top:8px;}

  .auth-screen{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:28px 22px;
    width:100%;
    max-width:360px;
  }
  .auth-card__brand{
    font-family:var(--font-display);
    font-weight:700;
    font-size:24px;
    letter-spacing:0.14em;
    text-align:center;
    margin-bottom:6px;
  }
  .auth-card__brand span{color:var(--accent);}
  .auth-card__sub{
    font-size:13px;
    color:var(--text-muted);
    text-align:center;
    margin:0 0 20px;
    line-height:1.5;
  }
  .auth-card .field{margin-bottom:14px;}
  .auth-card .btn{margin-bottom:10px;}
  .auth-card__error{
    font-size:12.5px;
    color:var(--danger);
    margin-bottom:12px;
    min-height:16px;
    line-height:1.4;
  }
  .auth-card__link{
    display:block;
    width:100%;
    background:none;
    border:none;
    color:var(--text-muted);
    font-family:var(--font-mono);
    font-size:11.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
    text-align:center;
  }

  details.plan-day{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    margin-bottom:12px;
    overflow:hidden;
  }
  details.plan-day > summary{
    list-style:none;
    cursor:pointer;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  details.plan-day > summary::-webkit-details-marker{display:none;}
  .plan-day__title{font-family:var(--font-display);font-size:18px;font-weight:600;}
  .plan-day__sub{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  .plan-day__chevron{width:18px;height:18px;color:var(--text-muted);transition:transform .2s;flex:none;}
  details[open] .plan-day__chevron{transform:rotate(180deg);}
  .plan-day__body{padding:0 16px 16px;}

  .info-box{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px;
    font-size:13px;
    color:var(--text-muted);
    line-height:1.5;
    margin-bottom:14px;
  }
  .info-box b{color:var(--text);}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:12px 10px;text-align:center;}
  .stat__value{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--accent);}
  .stat__label{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px;}

  .barbell-wrap{text-align:center;padding:10px 0 4px;}
  .barbell{position:relative;height:60px;display:flex;align-items:center;justify-content:center;}
  .barbell__bar{position:absolute;left:20%;right:20%;height:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:3px;}
  .barbell__plates{position:relative;display:flex;align-items:center;z-index:1;}
  .plate{
    border-radius:50%;
    border:3px solid var(--border);
    background:var(--surface);
    margin-left:-6px;
  }
  .plate:first-child{margin-left:0;}
  .plate--filled{border-color:var(--accent);background:radial-gradient(circle at 35% 30%, #2C8C7E, var(--accent));}
  .barbell-caption{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);margin-top:10px;}
  .barbell-caption b{color:var(--text);}

  .bw-chart{width:100%;height:90px;display:block;margin-top:6px;}
  .bw-delta{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);margin-top:8px;}
  .bw-delta.is-down{color:var(--accent);}
  .bw-delta.is-up{color:var(--danger);}

  details.history-item{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow);
    margin-bottom:10px;
    overflow:hidden;
  }
  details.history-item > summary{
    list-style:none;
    cursor:pointer;
    padding:13px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  details.history-item > summary::-webkit-details-marker{display:none;}
  .hist__title{font-weight:600;font-size:14px;}
  .hist__date{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:1px;}
  .hist__chevron{width:16px;height:16px;color:var(--text-muted);flex:none;transition:transform .2s;}
  details[open] .hist__chevron{transform:rotate(180deg);}
  .hist__body{padding:0 14px 14px;border-top:1px solid var(--border);}
  .hist__ex{padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .hist__ex:last-of-type{border-bottom:none;}
  .hist__ex-name{font-weight:600;}
  .hist__ex-sets{font-family:var(--font-mono);color:var(--text-muted);font-size:12.5px;margin-top:2px;}
  .hist__footer{display:flex;justify-content:flex-end;padding-top:10px;}

  .empty-state{
    text-align:center;
    padding:40px 16px;
    color:var(--text-muted);
  }
  .empty-state svg{width:40px;height:40px;color:var(--border);margin-bottom:12px;}
  .empty-state p{font-size:13.5px;line-height:1.5;margin:0 auto;max-width:280px;}

  .tabbar{
    position:sticky;
    bottom:0;
    display:flex;
    border-top:1px solid var(--border);
    background:rgba(247,246,243,0.94);
    backdrop-filter:blur(10px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .tabbar__btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:10px 0 8px;
    background:none;
    border:none;
    color:var(--text-muted);
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .tabbar__icon{width:21px;height:21px;}
  .tabbar__btn.is-active{color:var(--accent);}
</style>
</head>
<body>
<div id="authScreen" class="auth-screen" style="display:none;">
  <div class="auth-card">
    <div class="auth-card__brand">GHI<span>S</span>A</div>
    <p class="auth-card__sub">Accedi per sincronizzare i tuoi allenamenti su tutti i dispositivi.</p>
    <div class="field"><label>Email</label><input type="email" id="authEmail" autocomplete="username" /></div>
    <div class="field"><label>Password</label><input type="password" id="authPassword" autocomplete="current-password" /></div>
    <div class="auth-card__error" id="authError"></div>
    <button type="button" class="btn btn--primary" id="authLoginBtn">Accedi</button>
    <button type="button" class="btn btn--ghost" id="authRegisterBtn">Crea account</button>
    <button type="button" class="auth-card__link" id="authResetBtn">Password dimenticata?</button>
  </div>
</div>
<div id="app">
  <header class="topbar">
    <div class="topbar__brand">GHI<span>S</span>A</div>
    <div class="topbar__meta" id="topbarMeta">—</div>
  </header>
  <main class="view" id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button class="tabbar__btn" data-tab="oggi" type="button">
      <svg class="tabbar__icon" viewBox="0 0 24 24" fill="none"><path d="M12 2 14.2 8.6 21 8.9 15.6 13.2 17.5 20 12 16.1 6.5 20 8.4 13.2 3 8.9 9.8 8.6 Z" fill="currentColor"/></svg>
      <span>Oggi</span>
    </button>
    <button class="tabbar__btn" data-tab="piano" type="button">
      <svg class="tabbar__icon" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
      <span>Piano</span>
    </button>
    <button class="tabbar__btn" data-tab="progressi" type="button">
      <svg class="tabbar__icon" viewBox="0 0 24 24" fill="none"><path d="M4 21V11M11 21V4M18 21v-8" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
      <span>Progressi</span>
    </button>
  </nav>
</div>

<script>
(function(){
  "use strict";

  /* ======= CONFIGURAZIONE FIREBASE =======
     Sostituisci i valori qui sotto con quelli del tuo progetto
     (Project settings > General > Your apps, dopo aver registrato una Web app).
     Finché restano "INCOLLA_QUI", l'app funziona comunque, solo senza sincronizzazione cloud. */
  var firebaseConfig = {
    apiKey: "AIzaSyAaurYQXXHdGJn-9n6A8T03XyMLRWURd2I",
    authDomain: "ghisa-1a0ab.firebaseapp.com",
    projectId: "ghisa-1a0ab",
    storageBucket: "ghisa-1a0ab.firebasestorage.app",
    messagingSenderId: "202815854419",
    appId: "1:202815854419:web:ae45a65a1334867ca3b3a6"
  };
  var cloudEnabled = firebaseConfig.apiKey.indexOf("INCOLLA_QUI") === -1;
  var auth = null, db = null, currentUser = null, unsubscribeSnapshot = null;
  if(cloudEnabled){
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    try{ db.enablePersistence({synchronizeTabs:true}); }catch(e){ /* niente panico, resta comunque tutto salvato in locale */ }
  }

  var memCache = {};
  function loadJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      if(raw === null) return fallback;
      return JSON.parse(raw);
    }catch(e){
      return (key in memCache) ? memCache[key] : fallback;
    }
  }
  function saveJSON(key, value){
    memCache[key] = value;
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* fallback already cached */ }
  }

  /* defaultWeight: numero (kg) come suggerimento per esercizi con manubri, null per esercizi a corpo libero */
  var PLAN = {
    upperA: {
      label:"Upper A", sub:"Spinta dominante",

  function parseTargetRange(target){
    var m = target.match(/(\d+)\s*-\s*(\d+)/);
    if(m) return {min:parseInt(m[1],10), max:parseInt(m[2],10)};
    var m2 = target.match(/(\d+)/);
    if(m2){ var n=parseInt(m2[1],10); return {min:n, max:n}; }
    return null;
  }

  function buildFeedback(day){
    var analyzed = [];
    day.exercises.forEach(function(ex, idx){
      var raw = state.oggi.sets[idx] || [];
      var nums = raw.map(function(v){ return parseFloat((v+"").replace(",", ".")); }).filter(function(n){ return !isNaN(n); });
      if(!nums.length) return;
      var avg = nums.reduce(function(a,b){return a+b;},0)/nums.length;
      var range = parseTargetRange(ex.target);
      if(!range) return;
      var status = avg > range.max ? "exceeded" : (avg < range.min ? "below" : "on-track");
      var delta = status==="exceeded" ? (avg-range.max) : (status==="below" ? (range.min-avg) : 0);
      analyzed.push({name:ex.name, status:status, delta:delta});
    });
    if(!analyzed.length) return null;
    var exceeded = analyzed.filter(function(a){return a.status==="exceeded";});
    var below = analyzed.filter(function(a){return a.status==="below";});
    var onTrack = analyzed.filter(function(a){return a.status==="on-track";});
    var best = exceeded.length ? exceeded.reduce(function(p,c){return c.delta>p.delta?c:p;}) : null;
    var watch = below.length ? below.reduce(function(p,c){return c.delta>p.delta?c:p;}) : null;
    var goodCount = onTrack.length + exceeded.length;
    var summary = goodCount+" su "+analyzed.length+" esercizi in linea o oltre il target"+(below.length ? ", "+below.length+" sotto." : ".");
    var highlights = [];
    if(best) highlights.push("↑ "+best.name+": range superato — la prossima volta alza la difficoltà (tempo lento, monolaterale, meno recupero, o più peso se disponibile).");
    if(watch) highlights.push("↓ "+watch.name+": sotto il range questa volta — può capitare, tieni d'occhio recupero e tecnica.");
    if(!best && !watch) highlights.push("Tutti gli esercizi registrati sono in linea con il programma. Continua così.");
    return {summary:summary, highlights:highlights};
  }

  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+day;
  }
  function fmtDate(iso){
    var d = new Date(iso+"T12:00:00");
    var giorni = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
    return giorni[d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
  }
  function mondayOf(iso){
    var d = new Date(iso+"T12:00:00");
    var day = d.getDay();
    var diff = (day===0? -6 : 1-day);
    d.setDate(d.getDate()+diff);
    return d;
  }

      if(snap.exists){
        var data = snap.data();
        history = data.history || [];
        bw = data.bw || [];
        saveJSON("ghisa_history_v1", history);
        saveJSON("ghisa_bw_v1", bw);
        render();
      } else {
        pushToCloud();
      }
    }, function(err){

    });
  }
  function stopCloudSync(){
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }

  function pushToCloud(){
    if(!db || !currentUser) return;
    db.collection("users").doc(currentUser.uid).set({

      bw: bw,

  function renderBwChart(){
    var sorted = bw.slice().sort(function(a,b){return a.date<b.date?-1:1;}).slice(-12);
    var vals = sorted.map(function(x){return x.kg;});
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(min===max){ min -= 1; max += 1; }
    var w = 280, h = 70, pad = 8;
    var pts = sorted.map(function(x,i){
      var px = pad + (i/(Math.max(sorted.length-1,1))) * (w-2*pad);
      var py = h - pad - ((x.kg-min)/(max-min)) * (h-2*pad);
      return px.toFixed(1)+","+py.toFixed(1);
    }).join(" ");
    var html = '<svg class="bw-chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
    html += '<polyline points="'+pts+'" fill="none" stroke="#1F6F64" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
    html += '</svg>';
    if(sorted.length>1){
      var delta = (sorted[sorted.length-1].kg - sorted[0].kg).toFixed(1);
      var cls = delta<0 ? "is-down" : (delta>0 ? "is-up" : "");
      html += '<div class="bw-delta '+cls+'">'+(delta>0?"+":"")+delta+' kg su '+sorted.length+' pesate · ultima: '+sorted[sorted.length-1].kg+' kg</div>';
    }
    return html;
  }
